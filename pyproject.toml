[project]
name = "university-agentic-chat-api"
version = "0.1.0"
description = "FastAPI & RAG based Agentic University Chat API powered by LangChain and ChromaDB"
readme = "README.md"
authors = [
    { name = "demonize-c", email = "sourabmajhi.200@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "chromadb>=1.5.9",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "pymysql>=1.2.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
app = "python_university_support_agent.main:main"
api = "python_university_support_agent.cli:start"
clear-vector-store = "python_university_support_agent.scripts.clear_vector_store:clear_vector_store"
reset-db = "python_university_support_agent.scripts.reset_db:main"
reset-all = "python_university_support_agent.scripts.reset_all:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_university_support_agent"

